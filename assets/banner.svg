<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>

    <linearGradient id="accent-cyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>

    <linearGradient id="accent-purple" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>

    <linearGradient id="text-gradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .bg { fill: url(#bg-gradient); }
    .grid-line { stroke: rgba(255, 255, 255, 0.05); stroke-width: 1; }
    .radar-circle { stroke: rgba(6, 182, 212, 0.15); stroke-width: 1.5; fill: none; }
    
    /* Animated dynamic background elements placed safely in background */
    .pulse-wave {
      animation: pulse 4s infinite linear;
      transform-origin: 1000px 150px;
    }
    .sweep-line {
      animation: rotate 8s infinite linear;
      transform-origin: 1000px 150px;
    }
    .data-flow {
      stroke-dasharray: 10, 15;
      animation: dash 20s infinite linear;
    }
    
    @keyframes pulse {
      0% { r: 20px; opacity: 0.8; }
      100% { r: 180px; opacity: 0; }
    }
    @keyframes rotate {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    @keyframes dash {
      to { stroke-dashoffset: -1000; }
    }

    .title {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 800;
      font-size: 44px;
      fill: #ffffff;
      letter-spacing: -0.5px;
    }
    .subtitle {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 500;
      font-size: 20px;
      fill: #06b6d4;
      letter-spacing: 0.5px;
    }
    .desc {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 400;
      font-size: 15px;
      fill: #94a3b8;
    }
    .badge-text {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 600;
      font-size: 13px;
      fill: #e2e8f0;
    }
  </style>

  <!-- Background -->
  <rect width="1200" height="300" rx="16" class="bg" />

  <!-- Grid Pattern -->
  <g>
    <line x1="0" y1="60" x2="1200" y2="60" class="grid-line" />
    <line x1="0" y1="120" x2="1200" y2="120" class="grid-line" />
    <line x1="0" y1="180" x2="1200" y2="180" class="grid-line" />
    <line x1="0" y1="240" x2="1200" y2="240" class="grid-line" />
    <line x1="200" y1="0" x2="200" y2="300" class="grid-line" />
    <line x1="400" y1="0" x2="400" y2="300" class="grid-line" />
    <line x1="600" y1="0" x2="600" y2="300" class="grid-line" />
    <line x1="800" y1="0" x2="800" y2="300" class="grid-line" />
    <line x1="1000" y1="0" x2="1000" y2="300" class="grid-line" />
  </g>

  <!-- Dynamic Radar Background Animation (Right Side - Behind Content) -->
  <g>
    <circle cx="1000" cy="150" r="40" class="radar-circle" />
    <circle cx="1000" cy="150" r="90" class="radar-circle" />
    <circle cx="1000" cy="150" r="140" class="radar-circle" />
    <circle cx="1000" cy="150" r="40" class="pulse-wave" stroke="#06b6d4" stroke-width="2" fill="none" />
    <line x1="1000" y1="150" x2="1140" y2="150" class="sweep-line" stroke="url(#accent-cyan)" stroke-width="2" filter="url(#glow)" />
    
    <!-- Flow Curves -->
    <path d="M 0 250 Q 300 280, 600 220 T 1200 180" fill="none" stroke="url(#accent-cyan)" stroke-width="2" class="data-flow" opacity="0.4" />
    <path d="M 0 270 Q 400 210, 800 260 T 1200 200" fill="none" stroke="url(#accent-purple)" stroke-width="2" class="data-flow" opacity="0.3" />
  </g>

  <!-- Foreground Content Block (Layered Safely Above Background Graphics) -->
  <g transform="translate(60, 0)">
    <!-- Top Pill Badge -->
    <g transform="translate(0, 48)">
      <rect width="240" height="28" rx="14" fill="rgba(6, 182, 212, 0.15)" stroke="rgba(6, 182, 212, 0.4)" stroke-width="1" />
      <circle cx="16" cy="14" r="4" fill="#06b6d4" filter="url(#glow)" />
      <text x="28" y="19" class="badge-text">🚗 AWESOME AV ECOSYSTEM</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="125" class="title">Autonomous Vehicle Development</text>

    <!-- Subtitle -->
    <text x="0" y="162" class="subtitle">Simulation, ADAS, Sensor Modeling &amp; AV Software Stacks 🛠️</text>

    <!-- Description -->
    <text x="0" y="200" class="desc">Curated SaaS Platforms, Hardware-in-the-Loop (HIL) &amp; Open-Source Frameworks</text>

    <!-- Category Pills -->
    <g transform="translate(0, 226)">
      <!-- Pill 1 -->
      <rect x="0" y="0" width="130" height="26" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="65" y="17" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#cbd5e1">⚡ CARLA &amp; AWSIM</text>

      <!-- Pill 2 -->
      <rect x="140" y="0" width="140" height="26" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="210" y="17" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#cbd5e1">🤖 Autoware &amp; Apollo</text>

      <!-- Pill 3 -->
      <rect x="290" y="0" width="130" height="26" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="355" y="17" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#cbd5e1">🎯 Applied Intuition</text>
    </g>
  </g>
</svg>
