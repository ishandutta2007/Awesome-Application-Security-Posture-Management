<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9" />
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .title {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 800;
      font-size: 42px;
      fill: url(#textGrad);
    }
    .subtitle {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 500;
      font-size: 18px;
      fill: #94a3b8;
    }
    .tag {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 600;
      font-size: 13px;
      fill: #38bdf8;
    }
    .pulse-circle {
      animation: pulse 3s ease-in-out infinite alternate;
    }
    .float-card {
      animation: float 4s ease-in-out infinite alternate;
    }
    .flow-line {
      stroke-dasharray: 10, 10;
      animation: dash 20s linear infinite;
    }
    @keyframes pulse {
      0% { transform: scale(1); opacity: 0.3; }
      100% { transform: scale(1.15); opacity: 0.7; }
    }
    @keyframes float {
      0% { transform: translateY(0px); }
      100% { transform: translateY(-8px); }
    }
    @keyframes dash {
      to { stroke-dashoffset: -200; }
    }
  </style>

  <!-- Background -->
  <rect width="1200" height="320" fill="url(#bgGrad)" rx="16" />

  <!-- Animated Glowing Background Elements (Behind Everything) -->
  <circle cx="150" cy="80" r="100" fill="#3b82f6" opacity="0.15" class="pulse-circle" filter="url(#glow)" />
  <circle cx="1050" cy="240" r="120" fill="#8b5cf6" opacity="0.15" class="pulse-circle" filter="url(#glow)" />

  <!-- Decorative Flow Connection Line in Background -->
  <path d="M 100 240 Q 300 280 600 240 T 1100 100" stroke="#38bdf8" stroke-width="2" fill="none" opacity="0.3" class="flow-line" />
  <path d="M 50 120 Q 400 40 800 120 T 1150 220" stroke="#818cf8" stroke-width="1.5" fill="none" opacity="0.25" class="flow-line" />

  <!-- Background Animated Dashboard Preview Cards (Right Side, Layered Under Title Focus) -->
  <g class="float-card" transform="translate(820, 45)">
    <rect x="0" y="0" width="320" height="220" rx="12" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5" />
    <rect x="20" y="20" width="100" height="12" rx="4" fill="#38bdf8" opacity="0.8" />
    <rect x="20" y="45" width="280" height="8" rx="3" fill="#334155" />
    <rect x="20" y="60" width="220" height="8" rx="3" fill="#334155" />

    <!-- Mini Risk Score Widgets -->
    <rect x="20" y="85" width="80" height="50" rx="8" fill="#0f172a" stroke="#475569" stroke-width="1" />
    <text x="30" y="105" font-family="sans-serif" font-size="10" fill="#94a3b8">Risk Score</text>
    <text x="30" y="125" font-family="sans-serif" font-size="16" font-weight="bold" fill="#ef4444">8.9 High</text>

    <rect x="110" y="85" width="80" height="50" rx="8" fill="#0f172a" stroke="#475569" stroke-width="1" />
    <text x="120" y="105" font-family="sans-serif" font-size="10" fill="#94a3b8">Scanners</text>
    <text x="120" y="125" font-family="sans-serif" font-size="16" font-weight="bold" fill="#10b981">12 Active</text>

    <rect x="200" y="85" width="100" height="50" rx="8" fill="#0f172a" stroke="#475569" stroke-width="1" />
    <text x="210" y="105" font-family="sans-serif" font-size="10" fill="#94a3b8">Coverage</text>
    <text x="210" y="125" font-family="sans-serif" font-size="16" font-weight="bold" fill="#38bdf8">94% SDLC</text>

    <!-- Mini Pipeline Flow Graph -->
    <path d="M 20 175 L 80 160 L 140 185 L 200 150 L 280 170" stroke="#818cf8" stroke-width="2" fill="none" />
    <circle cx="80" cy="160" r="4" fill="#38bdf8" />
    <circle cx="140" cy="185" r="4" fill="#ef4444" />
    <circle cx="200" cy="150" r="4" fill="#10b981" />
    <circle cx="280" cy="170" r="4" fill="#f59e0b" />
  </g>

  <!-- Left Side Text & Main Branding (CLEAR FOREGROUND - Unobstructed) -->
  <g transform="translate(60, 0)">
    <!-- Badge Pill -->
    <g transform="translate(0, 50)">
      <rect x="0" y="0" width="280" height="28" rx="14" fill="#1e293b" stroke="#38bdf8" stroke-width="1" />
      <circle cx="14" cy="14" r="5" fill="#38bdf8" />
      <text x="28" y="19" class="tag">DEVSECOPS &amp; SECURITY POSTURE</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="130" class="title">Application Security Posture</text>
    <text x="0" y="180" class="title">Management (ASPM)</text>

    <!-- Subtitle -->
    <text x="0" y="225" class="subtitle">Curated SaaS Platforms, Risk Correlation Engines &amp; Open-Source Ecosystem</text>

    <!-- Feature Pills -->
    <g transform="translate(0, 255)">
      <rect x="0" y="0" width="130" height="26" rx="6" fill="#0f172a" stroke="#475569" stroke-width="1" />
      <text x="12" y="17" font-family="sans-serif" font-size="12" fill="#cbd5e1">🛡️ Risk Scoring</text>

      <rect x="140" y="0" width="140" height="26" rx="6" fill="#0f172a" stroke="#475569" stroke-width="1" />
      <text x="152" y="17" font-family="sans-serif" font-size="12" fill="#cbd5e1">🔍 Code-to-Cloud</text>

      <rect x="290" y="0" width="130" height="26" rx="6" fill="#0f172a" stroke="#475569" stroke-width="1" />
      <text x="302" y="17" font-family="sans-serif" font-size="12" fill="#cbd5e1">⚡ SBOM &amp; SCA</text>

      <rect x="430" y="0" width="140" height="26" rx="6" fill="#0f172a" stroke="#475569" stroke-width="1" />
      <text x="442" y="17" font-family="sans-serif" font-size="12" fill="#cbd5e1">📊 DevSecOps</text>
    </g>
  </g>
</svg>
