<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#070a12" />
    </linearGradient>

    <!-- Glowing Accent Gradients -->
    <linearGradient id="primaryGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>

    <linearGradient id="cyanGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>

    <linearGradient id="emeraldGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>

    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9" />
    </linearGradient>

    <!-- Filters for Glow Effect -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    @keyframes pulseGrid {
      0%, 100% { opacity: 0.15; }
      50% { opacity: 0.35; }
    }
    @keyframes radarScan {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    @keyframes floatParticle {
      0%, 100% { transform: translateY(0px) scale(1); }
      50% { transform: translateY(-12px) scale(1.1); }
    }
    @keyframes dashMove {
      to { stroke-dashoffset: -40; }
    }
    @keyframes badgeGlow {
      0%, 100% { filter: drop-shadow(0 0 4px rgba(99, 102, 241, 0.4)); }
      50% { filter: drop-shadow(0 0 12px rgba(236, 72, 153, 0.7)); }
    }

    .bg-grid { animation: pulseGrid 6s ease-in-out infinite; }
    .radar-beam { transform-origin: 1020px 210px; animation: radarScan 10s linear infinite; }
    .particle { animation: floatParticle 4s ease-in-out infinite; }
    .data-stream { stroke-dasharray: 8 8; animation: dashMove 2s linear infinite; }
    .glowing-badge { animation: badgeGlow 4s ease-in-out infinite; }
    
    .title-text {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 800;
      font-size: 38px;
      fill: #ffffff;
    }
    .subtitle-text {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 500;
      font-size: 18px;
      fill: #94a3b8;
    }
    .pill-text {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 600;
      font-size: 13px;
      fill: #f8fafc;
    }
  </style>

  <!-- Background Layer -->
  <rect width="1200" height="420" rx="16" fill="url(#bgGradient)" />

  <!-- Animated Grid Pattern -->
  <g class="bg-grid" stroke="#334155" stroke-width="1">
    <path d="M0 60 H1200 M0 120 H1200 M0 180 H1200 M0 240 H1200 M0 300 H1200 M0 360 H1200" />
    <path d="M100 0 V420 M200 0 V420 M300 0 V420 M400 0 V420 M500 0 V420 M600 0 V420 M700 0 V420 M800 0 V420 M900 0 V420 M1000 0 V420 M1100 0 V420" />
  </g>

  <!-- Dynamic Security Mesh & Radar (Background Element - Right Aligned) -->
  <g opacity="0.45">
    <circle cx="1020" cy="210" r="140" fill="none" stroke="#475569" stroke-width="1.5" stroke-dasharray="4 4" />
    <circle cx="1020" cy="210" r="90" fill="none" stroke="#6366f1" stroke-width="1" opacity="0.6" />
    <circle cx="1020" cy="210" r="40" fill="none" stroke="#06b6d4" stroke-width="1.5" />
    
    <!-- Rotating Radar Beam -->
    <path class="radar-beam" d="M1020 210 L1160 210 A140 140 0 0 0 1020 70 Z" fill="url(#cyanGlow)" opacity="0.25" />

    <!-- Connecting Risk Nodes -->
    <line x1="880" y1="120" x2="940" y2="180" stroke="#6366f1" stroke-width="2" class="data-stream" />
    <line x1="940" y1="180" x2="1020" y2="210" stroke="#8b5cf6" stroke-width="2" class="data-stream" />
    <line x1="1020" y1="210" x2="1100" y2="280" stroke="#ec4899" stroke-width="2" class="data-stream" />

    <!-- Nodes -->
    <circle cx="880" cy="120" r="6" fill="#6366f1" class="particle" />
    <circle cx="940" cy="180" r="8" fill="#8b5cf6" />
    <circle cx="1100" cy="280" r="7" fill="#ec4899" class="particle" />
  </g>

  <!-- Glowing Top Border Accent Line -->
  <rect x="0" y="0" width="1200" height="5" fill="url(#primaryGlow)" />

  <!-- Main Content Foreground Group (Ensures absolute priority & clarity above dynamic elements) -->
  <g transform="translate(60, 0)">
    
    <!-- Category Badge -->
    <g transform="translate(0, 55)" class="glowing-badge">
      <rect width="180" height="32" rx="16" fill="url(#primaryGlow)" />
      <text x="90" y="21" text-anchor="middle" font-family="sans-serif" font-weight="700" font-size="12" fill="#ffffff" letter-spacing="1">
        SECURITY POSTURE
      </text>
    </g>

    <!-- Main Title -->
    <text x="0" y="145" class="title-text" filter="url(#softGlow)">
      Awesome Application Security
    </text>
    <text x="0" y="195" class="title-text" fill="url(#primaryGlow)">
      Posture Management (ASPM)
    </text>

    <!-- Subtitle -->
    <text x="0" y="240" class="subtitle-text">
      Curated directory of enterprise ASPM SaaS platforms &amp; open-source security correlation engines.
    </text>

    <!-- Interactive Pillar Pills (SCA, SAST, Risk Graph, DevSecOps, Supply Chain) -->
    <g transform="translate(0, 275)">
      <!-- Pill 1: Risk Prioritization -->
      <g transform="translate(0, 0)">
        <rect width="165" height="38" rx="8" fill="url(#cardBg)" stroke="#6366f1" stroke-width="1.5" />
        <circle cx="20" cy="19" r="5" fill="#10b981" />
        <text x="34" y="24" class="pill-text">Risk Prioritization</text>
      </g>

      <!-- Pill 2: DevSecOps -->
      <g transform="translate(180, 0)">
        <rect width="185" height="38" rx="8" fill="url(#cardBg)" stroke="#8b5cf6" stroke-width="1.5" />
        <circle cx="20" cy="19" r="5" fill="#06b6d4" />
        <text x="34" y="24" class="pill-text">DevSecOps Orchestration</text>
      </g>

      <!-- Pill 3: Supply Chain -->
      <g transform="translate(380, 0)">
        <rect width="180" height="38" rx="8" fill="url(#cardBg)" stroke="#ec4899" stroke-width="1.5" />
        <circle cx="20" cy="19" r="5" fill="#ec4899" />
        <text x="34" y="24" class="pill-text">Software Supply Chain</text>
      </g>

      <!-- Pill 4: Open Source -->
      <g transform="translate(575, 0)">
        <rect width="150" height="38" rx="8" fill="url(#cardBg)" stroke="#10b981" stroke-width="1.5" />
        <circle cx="20" cy="19" r="5" fill="#6366f1" />
        <text x="34" y="24" class="pill-text">SaaS &amp; Open-Source</text>
      </g>
    </g>

    <!-- Footer Stats / Meta Line -->
    <g transform="translate(0, 360)">
      <text font-family="sans-serif" font-size="13" fill="#64748b" font-weight="500">
        🛡️ SAST • SCA • DAST • Cloud Posture • Container Security • Vulnerability Management • SBOM
      </text>
    </g>

  </g>
</svg>
